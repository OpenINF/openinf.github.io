<!--
  The ring off the logogram, not the logogram: the navbar already carries the
  mark, and a second copy under it only reads as a repeat.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  preserveAspectRatio="xMidYMid meet"
>
  <circle
    cx="50"
    cy="50"
    r="45"
    fill="none"
    stroke="currentColor"
    stroke-width="10"
  />
</svg>
