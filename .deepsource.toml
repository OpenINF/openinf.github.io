version = 1
exclude_patterns = [
  "_assets/js/vendor/**",
  "pnpm-lock.yaml",
]

[[analyzers]]
name = "test-coverage"
enabled = false

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
environment = [
  "nodejs",
  "browser",
]

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = [".devcontainer/Dockerfile"]

[[transformers]]
name = "prettier"
enabled = false
