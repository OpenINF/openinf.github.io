# pnpm 10 onwards reads .npmrc for auth and registry only; everything else
# belongs here.
saveExact: true

# Makes the exact node and pnpm in engines requirements rather than notes.
engineStrict: true

# pnpm wants an explicit decision for every dependency that asks to run an
# install script, and fails until it gets one. The answer is no throughout:
# nothing here needs a script to work, because the binaries either arrive as
# optional dependencies per platform or ship inside the package. Confirm that
# with a full build and the verify tasks before allowing any.
allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  dprint: false
  es5-ext: false
  vnu-jar: false

# The dprint VS Code extension looks for node_modules/@dprint/<platform>, which
# pnpm keeps in the virtual store where the extension cannot see it.
publicHoistPattern:
  - '@dprint/*'
