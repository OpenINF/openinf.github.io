# pnpm 10 onwards reads .npmrc for auth and registry only, so settings have to
# live here to have any effect. Every dependency in this repository is pinned,
# and this is what keeps it that way.
saveExact: true

# pnpm 11 requires an explicit decision for every dependency that wants to run
# an install script, and fails the install until it gets one. The answer is no
# across the board. (This used to cite `ignore-dep-scripts` in .npmrc as the
# reason; pnpm never read it.)
#
# Nothing needs them. biome, dprint and esbuild ship their platform binaries as
# optional dependencies rather than fetching them from a postinstall hook,
# vnu-jar ships its jar inside the package, and es5-ext's script only prints a
# funding notice. Verified by running the full build and the verify tasks with
# every one of these denied.
allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  dprint: false
  es5-ext: false
  esbuild: false
  vnu-jar: false

# The dprint VS Code extension resolves its executable from
# node_modules/@dprint/<platform>. That package is an optionalDependency of
# dprint, so pnpm keeps it in the virtual store where the extension cannot see
# it -- which is why the extension used to need a separately installed dprint.
publicHoistPattern:
  - '@dprint/*'
